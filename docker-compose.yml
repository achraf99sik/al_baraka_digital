version: "3.8"

services:
  app:
    build: .
    container_name: baraka_app
    ports:
      - "3000:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - PG_HOST=db
      - PG_PORT=5432
      - PG_DB=baraka
      - PG_USERNAME=postgres
      - PG_PASSWORD=postgres
    depends_on:
      - db
    networks:
      - baraka_network
    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgres:17
    container_name: baraka_db
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=baraka
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - baraka_network

networks:
  baraka_network:
    driver: bridge

volumes:
  postgres_data:
